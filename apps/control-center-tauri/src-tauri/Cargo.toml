[package]
name = "digitalpulse-control-center"
version = "0.2.0"
description = "DigitalPulse employee control center"
authors = ["DigitalPulse Engineering"]
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[[bin]]
name = "DigitalPulse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dp-platform-windows = { path = "../../../desktop-agent/crates/dp-platform-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

